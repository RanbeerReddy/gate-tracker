appId: com.gatetracker.app
productName: GATE Tracker
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GATE Tracker
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
extraMetadata:
  main: dist-electron/main.js
